%rebase('osnova.html', naslov='Dodaj recept')

<style>
    .form-wrapper {
        max-width: 1000px;
        margin: auto;
    }

    .form-row {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 40px;
        padding: 20px 0;
        border-bottom: 1px solid #e5e5e5;
    }

    .left-side {
        font-weight: bold;
        font-size: 17px;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
    }

    .right-side {
        width: 100%;
    }

    .right-side input,
    .right-side textarea,
    .right-side select {
        width: 100%;
    }

    h2 {
        margin-bottom: 40px;
    }

    .sestavina-blok,
    .pripomocek-blok {
        margin-bottom: 15px;
    }
</style>

<div class="form-wrapper">

    <h2>Vnesi potrebne podatke o receptu</h2>

    <form method="post" action="{{url('dodaj_recept')}}">

        <div class="form-row">
            <div class="left-side">Ime sladice</div>
            <div class="right-side">
                <input type="text" class="form-control" id="ime" name="ime" required placeholder="Vnesi ime sladice">
            </div>
        </div>

        <div class="form-row">
            <div class="left-side">Čas priprave</div>
            <div class="right-side">
                <input type="time" class="form-control" id="cas_priprave" name="cas_priprave" required>
            </div>
        </div>

        <div class="form-row">
            <div class="left-side">Težavnost</div>
            <div class="right-side">
                <select class="form-select" id="tezavnost" name="tezavnost" required>
                    <option value="">Izberi težavnost</option>
                    <option value="lahko">Enostavno</option>
                    <option value="srednje">Srednje</option>
                    <option value="tezko">Zahtevno</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="left-side">Kategorija</div>
            <div class="right-side">
                <select class="form-select" id="kategorija" name="kategorija" required>
                    <option value="">Izberi kategorijo</option>
                    <option value="1">Torte</option>
                    <option value="2">Piškoti</option>
                    <option value="3">Mafini</option>
                    <option value="4">Drobno pecivo</option>
                    <option value="5">Sladoled</option>
                    <option value="6">Kreme</option>
                    <option value="7">Napitki</option>
                    <option value="8">Pite</option>
                    <option value="9">Zavitki</option>
                    <option value="10">Ostalo</option>
                </select>
            </div>
        </div>
    

        <div class="form-row">
            <div class="left-side">Kratek opis</div>
            <div class="right-side">
                <textarea class="form-control" id="kratek_opis" name="kratek_opis" rows="3" required
                    placeholder="Vnesi kratek opis"></textarea>
            </div>
        </div>

        <div class="form-row">
            <div class="left-side">Sestavine</div>
            <div class="right-side">
                <div id="sestavine-vsebnik">
                    <div class="sestavina-blok">
                        <select class="form-select mb-2" name="sestavine">
                            <option value="">Izberi sestavino</option>
                            <option value="jajca">Jajca</option>
                            <option value="mleko">Mleko</option>
                            <option value="maslo">Maslo</option>
                            <option value="sladkor">Sladkor</option>
                        </select>
                        <div class="input-group">
                            <input type="number" class="form-control" name="kolicina" min="0"
                                placeholder="Vnesi količino">
                            <span class="input-group-text enota-oznaka">-</span>
                        </div>
                    </div>
                </div>

                <button type="button" id="gumb-dodaj-sestavino" class="btn btn-secondary btn-sm mt-2">
                    + Dodaj sestavino
                </button>
            </div>
        </div>
<div class="form-row">
    <div class="left-side">Pripomočki</div>

    <div class="right-side">

        <div id="pripomocki-vsebnik">

            <div class="pripomocek-blok mb-2">

                <select class="form-select" name="pripomocki">
                    <option value="">Izberi pripomoček</option>
                    <option value="pekac">Pekač</option>
                    <option value="metlica">Metlica</option>
                    <option value="zlica">Žlica</option>
                    <option value="posoda">Posoda</option>
                    <option value="mikser">Mikser</option>
                    <option value="valjar">Valjar</option>
                </select>

            </div>

        </div>

        <button type="button"
                id="gumb-dodaj-pripomocek"
                class="btn btn-secondary btn-sm mt-2">

            + Dodaj pripomoček

        </button>

    </div>
</div>

        <div class="form-row">
            <div class="left-side">Postopek</div>
            <div class="right-side">
                <textarea class="form-control" id="postopek" name="postopek" rows="6" required
                    placeholder="Vnesi postopek"></textarea>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Dodaj recept</button>
        </div>

    </form>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 1. Slovar merskih enot
        const merskeEnote = {
            'jajca': 'kos',
            'mleko': 'ml',
            'maslo': 'g',
            'sladkor': 'g',
            '': '-'
        };

        const gumb = document.getElementById('gumb-dodaj-sestavino');
        const vsebnik = document.getElementById('sestavine-vsebnik');

        // 2. Samo EDEN poslušalec za gumb, ki doda točno EN pravilen blok
        if (gumb) {
            gumb.addEventListener('click', function () {
                const novBlok = document.createElement('div');
                novBlok.className = 'sestavina-blok mt-3';

                novBlok.innerHTML = `
                <select class="form-select mb-2" name="sestavine">
                    <option value="">Izberite sestavino</option>
                    <option value="jajca">Jajca</option>
                    <option value="mleko">Mleko</option>
                    <option value="maslo">Maslo</option>
                    <option value="sladkor">Sladkor</option>
                </select>
                <div class="input-group">
                    <input type="number" class="form-control" name="kolicina" min="0" placeholder="Vnesi količino">
                    <span class="input-group-text enota-oznaka">-</span>
                </div>
            `;

                vsebnik.appendChild(novBlok);
            });
        }

        // 3. Posodabljanje enot ob spremembi izbire
        if (vsebnik) {
            vsebnik.addEventListener('change', function (e) {
                if (e.target && e.target.name === 'sestavine') {
                    const izbranaSestavina = e.target.value;
                    const enota = merskeEnote[izbranaSestavina] || '-';

                    const starsevskiBlok = e.target.closest('.sestavina-blok');
                    const oznakaEnote = starsevskiBlok.querySelector('.enota-oznaka');

                    if (oznakaEnote) {
                        oznakaEnote.textContent = enota;
                    }
                }
            });
        }
    });


document.getElementById("gumb-dodaj-pripomocek")
.addEventListener("click", function () {

    const vsebnik = document.getElementById("pripomocki-vsebnik");

    const novBlok = document.createElement("div");

    novBlok.classList.add("pripomocek-blok", "mb-2");

    novBlok.innerHTML = `
        <select class="form-select" name="pripomocki">

            <option value="">Izberite pripomoček</option>
            <option value="pekac">Pekač</option>
            <option value="metlica">Metlica</option>
            <option value="zlica">Žlica</option>
            <option value="posoda">Posoda</option>
            <option value="mikser">Mikser</option>
            <option value="valjar">Valjar</option>

        </select>
    `;

    vsebnik.appendChild(novBlok);

});

</script>
