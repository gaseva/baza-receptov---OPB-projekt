%rebase('osnova.html', naslov='Dodaj recept')

<div class="add-recipe-page">
    <h1>Dodaj recept</h1>

    <div class="form-wrapper">
        <h2>Vnesi potrebne podatke o receptu</h2>

        % if napaka_recepta:
            <div class="alert alert-danger" role="alert">
                {{napaka_recepta}}
            </div>
        % end

        <form method="post" action="/dodaj_recept">

            <div class="form-row">
                <div class="left-side">Ime sladice</div>
                <div class="right-side">
                    <input type="text" class="form-control" id="ime" name="ime" required placeholder="Vnesi ime sladice">
                </div>
            </div>

            <div class="form-row">
                <div class="left-side">Čas priprave</div>
                <div class="right-side">
                    <input type="number" class="form-control" id="cas_priprave" name="cas_priprave" required placeholder="Čas priprave v minutah">
                </div>
            </div>

            <div class="form-row">
                <div class="left-side">Težavnost</div>
                <div class="right-side">
                    <select class="form-select" id="tezavnost" name="tezavnost" required>
                        <option value="">Izberi težavnost</option>
                        <option value="1">Enostavno</option>
                        <option value="2">Srednje</option>
                        <option value="3">Zahtevno</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="left-side">Kategorija</div>
                <div class="right-side">
                    <select class="form-select" id="kategorija" name="kategorija" required>
                        <option value="">Izberi kategorijo</option>
                        <option value="1">Torte</option>
                        <option value="2">Piškoti</option>
                        <option value="3">Mafini</option>
                        <option value="4">Drobno pecivo</option>
                        <option value="5">Sladoled</option>
                        <option value="6">Kreme</option>
                        <option value="7">Napitki</option>
                        <option value="8">Pite</option>
                        <option value="9">Zavitki</option>
                        <option value="10">Ostalo</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="left-side">Kratek opis</div>
                <div class="right-side">
                    <textarea class="form-control" id="kratek_opis" name="kratek_opis" rows="3" required
                        placeholder="Vnesi kratek opis"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="left-side">Sestavine</div>
                <div class="right-side">
                    <div id="sestavine-vsebnik">
                        <div class="sestavina-blok">
                            <select class="form-select mb-2" name="sestavine">
                                <option value="">Izberi sestavino</option>

                                % for sestavina in sestavine:
                                    <option value="{{sestavina.id}}" data-enota="{{sestavina.enota}}">
                                        {{sestavina.ime}}
                                    </option>
                                % end
                            </select>

                            <div class="input-group">
                                <input type="number" class="form-control" name="kolicina" min="0"
                                    placeholder="Vnesi količino">
                                <span class="input-group-text enota-oznaka">-</span>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="gumb-dodaj-sestavino" class="btn btn-outline-primary btn-sm mt-2">
                        + Dodaj sestavino
                    </button>

                    <details class="new-item-box mt-4">
                        <summary>Ali sestavine ni na seznamu?</summary>

                        <div class="new-item-content">
                            <div class="mb-2">
                                <label for="ime_sestavine">Ime nove sestavine</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="ime_sestavine"
                                    name="ime_sestavine"
                                >
                            </div>

                            <div class="mb-2">
                                <label for="enota_sestavine">Merska enota (na primer: g, ml, kos)</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="enota_sestavine"
                                    name="enota_sestavine"
                                >
                            </div>

                            <button
                                type="button"
                                id="gumb-ustvari-sestavino"
                                class="btn btn-outline-primary btn-sm mt-2"
                            >
                                Ustvari sestavino
                            </button>

                            <p id="sporocilo-sestavine" class="mt-2" aria-live="polite"></p>
                        </div>
                    </details>
                </div>
            </div>

            <div class="form-row">
                <div class="left-side">Pripomočki</div>
                <div class="right-side">
                    <div id="pripomocki-vsebnik">
                        <div class="pripomocek-blok mb-2">
                            <select class="form-select" name="pripomocki">
                                <option value="">Izberi pripomoček</option>

                                % for pripomocek in pripomocki:
                                    <option value="{{pripomocek.id}}">
                                        {{pripomocek.ime}}
                                    </option>
                                % end
                            </select>
                        </div>
                    </div>

                    <button
                        type="button"
                        id="gumb-dodaj-pripomocek"
                        class="btn btn-outline-primary btn-sm mt-2"
                    >
                        + Dodaj pripomoček
                    </button>

                    <details class="new-item-box mt-4">
                        <summary>Ali pripomočka ni na seznamu?</summary>

                        <div class="new-item-content">
                            <div class="mb-2">
                                <label for="ime_pripomocka">Ime novega pripomočka</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="ime_pripomocka"
                                    name="ime_pripomocka"
                                >
                            </div>

                            <button
                                type="button"
                                id="gumb-ustvari-pripomocek"
                                class="btn btn-outline-primary btn-sm mt-2"
                            >
                                Ustvari pripomoček
                            </button>

                            <p id="sporocilo-pripomocka" class="mt-2" aria-live="polite"></p>
                        </div>
                    </details>
                </div>
            </div>

            <div class="form-row">
                <div class="left-side">Postopek</div>
                <div class="right-side">
                    <textarea class="form-control" id="postopek" name="postopek" rows="6" required
                        placeholder="Vnesi postopek"></textarea>
                </div>
            </div>

            <div class="form-submit mt-4">
                <button type="submit" class="btn btn-primary">
                    Dodaj recept
                </button>
            </div>
        </form>

    </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', function () {
    // DODAJANJE SESTAVIN
    const gumb = document.getElementById('gumb-dodaj-sestavino');
    const vsebnik = document.getElementById('sestavine-vsebnik');

    if (gumb && vsebnik) {
        gumb.addEventListener('click', function () {
            const prviBlok = vsebnik.querySelector('.sestavina-blok');
            const novBlok = prviBlok.cloneNode(true);

            const select =
                novBlok.querySelector('select[name="sestavine"]');

            const kolicina =
                novBlok.querySelector('input[name="kolicina"]');

            const enota =
                novBlok.querySelector('.enota-oznaka');

            select.selectedIndex = 0;
            kolicina.value = '';
            enota.textContent = '-';

            novBlok.classList.add('mt-3');
            vsebnik.appendChild(novBlok);
        });
    }

    // PRIKAZ MERSKE ENOTE
    if (vsebnik) {
        vsebnik.addEventListener('change', function (e) {
            if (e.target.name === 'sestavine') {
                const izbranaMoznost =
                    e.target.options[e.target.selectedIndex];

                const enota =
                    izbranaMoznost.dataset.enota || '-';

                const starsevskiBlok =
                    e.target.closest('.sestavina-blok');

                const oznakaEnote =
                    starsevskiBlok.querySelector('.enota-oznaka');

                oznakaEnote.textContent = enota;
            }
        });
    }

    // DODAJANJE PRIPOMOČKOV
    const gumbPripomocek =
        document.getElementById('gumb-dodaj-pripomocek');

    const vsebnikPripomocki =
        document.getElementById('pripomocki-vsebnik');

    if (gumbPripomocek && vsebnikPripomocki) {
        gumbPripomocek.addEventListener('click', function () {
            const prviBlok =
                vsebnikPripomocki.querySelector('.pripomocek-blok');

            const novBlok = prviBlok.cloneNode(true);

            const select =
                novBlok.querySelector('select[name="pripomocki"]');

            select.selectedIndex = 0;
            novBlok.classList.add('mt-3');
            vsebnikPripomocki.appendChild(novBlok);
        });
    }

    // USTVARJANJE SESTAVINE BREZ OSVEŽITVE STRANI
    const gumbUstvariSestavino =
        document.getElementById('gumb-ustvari-sestavino');
    const imeSestavine = document.getElementById('ime_sestavine');
    const enotaSestavine = document.getElementById('enota_sestavine');
    const sporociloSestavine =
        document.getElementById('sporocilo-sestavine');

    if (
        gumbUstvariSestavino &&
        imeSestavine &&
        enotaSestavine &&
        sporociloSestavine
    ) {
        gumbUstvariSestavino.addEventListener('click', async function () {
            sporociloSestavine.textContent = '';
            sporociloSestavine.className = 'mt-2';
            gumbUstvariSestavino.disabled = true;

            const podatki = new URLSearchParams();
            podatki.append('ime_sestavine', imeSestavine.value);
            podatki.append('enota_sestavine', enotaSestavine.value);

            try {
                const odgovor = await fetch('/dodaj_sestavino', {
                    method: 'POST',
                    headers: {
                        'Content-Type':
                            'application/x-www-form-urlencoded;charset=UTF-8'
                    },
                    body: podatki.toString()
                });

                const tipVsebine =
                    odgovor.headers.get('content-type') || '';

                if (!tipVsebine.includes('application/json')) {
                    throw new Error(
                        'Seja je morda potekla. Osveži stran in se ponovno prijavi.'
                    );
                }

                const rezultat = await odgovor.json();

                if (!odgovor.ok || !rezultat.uspeh) {
                    throw new Error(
                        rezultat.napaka || 'Sestavine ni bilo mogoče ustvariti.'
                    );
                }

                const vsiSelecti = Array.from(
                    document.querySelectorAll('select[name="sestavine"]')
                );

                vsiSelecti.forEach(function (select) {
                    const moznost = document.createElement('option');
                    moznost.value = rezultat.sestavina.id;
                    moznost.textContent = rezultat.sestavina.ime;
                    moznost.dataset.enota = rezultat.sestavina.enota;
                    select.appendChild(moznost);
                });

                let ciljniSelect = vsiSelecti.find(function (select) {
                    return !select.value;
                });

                if (!ciljniSelect && gumb && vsebnik) {
                    gumb.click();
                    const posodobljeniSelecti =
                        vsebnik.querySelectorAll('select[name="sestavine"]');
                    ciljniSelect =
                        posodobljeniSelecti[posodobljeniSelecti.length - 1];
                }

                if (ciljniSelect) {
                    ciljniSelect.value = String(rezultat.sestavina.id);
                    ciljniSelect.dispatchEvent(
                        new Event('change', {bubbles: true})
                    );
                }

                imeSestavine.value = '';
                enotaSestavine.value = '';
                sporociloSestavine.textContent =
                    'Sestavina je bila uspešno ustvarjena.';
                sporociloSestavine.className = 'text-success mt-2';
            } catch (napaka) {
                sporociloSestavine.textContent = napaka.message;
                sporociloSestavine.className = 'text-danger mt-2';
            } finally {
                gumbUstvariSestavino.disabled = false;
            }
        });
    }

    // USTVARJANJE PRIPOMOČKA BREZ OSVEŽITVE STRANI
    const gumbUstvariPripomocek =
        document.getElementById('gumb-ustvari-pripomocek');
    const imePripomocka = document.getElementById('ime_pripomocka');
    const sporociloPripomocka =
        document.getElementById('sporocilo-pripomocka');

    if (
        gumbUstvariPripomocek &&
        imePripomocka &&
        sporociloPripomocka
    ) {
        gumbUstvariPripomocek.addEventListener('click', async function () {
            sporociloPripomocka.textContent = '';
            sporociloPripomocka.className = 'mt-2';
            gumbUstvariPripomocek.disabled = true;

            const podatki = new URLSearchParams();
            podatki.append('ime_pripomocka', imePripomocka.value);

            try {
                const odgovor = await fetch('/dodaj_pripomocek', {
                    method: 'POST',
                    headers: {
                        'Content-Type':
                            'application/x-www-form-urlencoded;charset=UTF-8'
                    },
                    body: podatki.toString()
                });

                const tipVsebine =
                    odgovor.headers.get('content-type') || '';

                if (!tipVsebine.includes('application/json')) {
                    throw new Error(
                        'Seja je morda potekla. Osveži stran in se ponovno prijavi.'
                    );
                }

                const rezultat = await odgovor.json();

                if (!odgovor.ok || !rezultat.uspeh) {
                    throw new Error(
                        rezultat.napaka || 'Pripomočka ni bilo mogoče ustvariti.'
                    );
                }

                const vsiSelecti = Array.from(
                    document.querySelectorAll('select[name="pripomocki"]')
                );

                vsiSelecti.forEach(function (select) {
                    const moznost = document.createElement('option');
                    moznost.value = rezultat.pripomocek.id;
                    moznost.textContent = rezultat.pripomocek.ime;
                    select.appendChild(moznost);
                });

                let ciljniSelect = vsiSelecti.find(function (select) {
                    return !select.value;
                });

                if (!ciljniSelect && gumbPripomocek && vsebnikPripomocki) {
                    gumbPripomocek.click();
                    const posodobljeniSelecti =
                        vsebnikPripomocki.querySelectorAll(
                            'select[name="pripomocki"]'
                        );
                    ciljniSelect =
                        posodobljeniSelecti[posodobljeniSelecti.length - 1];
                }

                if (ciljniSelect) {
                    ciljniSelect.value = String(rezultat.pripomocek.id);
                }

                imePripomocka.value = '';
                sporociloPripomocka.textContent =
                    'Pripomoček je bil uspešno ustvarjen.';
                sporociloPripomocka.className = 'text-success mt-2';
            } catch (napaka) {
                sporociloPripomocka.textContent = napaka.message;
                sporociloPripomocka.className = 'text-danger mt-2';
            } finally {
                gumbUstvariPripomocek.disabled = false;
            }
        });
    }
});
</script>
