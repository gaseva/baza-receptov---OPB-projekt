%rebase('osnova.html', naslov='Prijava', stran='prijava')

<form action="/prijava" method="POST" style="width:60%">
  <div class="form-group">
    <label for="username">Uporabniško ime</label>
    <input type="text" class="form-control" name="username" placeholder="Vnesi uporabniško ime">
  </div>
  <div class="form-group">
    <label for="password">Geslo</label>
    <input type="password" class="form-control" name="password" placeholder="Geslo">
  </div>

  <button type="submit" class="btn btn-primary">Prijava</button>
</form>
